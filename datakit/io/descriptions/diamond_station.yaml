name: diamond_station
implementation: diamond_station
layout:
  directory: "{time:%Y%m%d}"
  filename: "{time:%H}.000"
time_zone: "Asia/Shanghai"
example: "20250101/06.000"
notes: "时间保持源文件的北京时间，不做UTC转换。保留数值列和缺测哨兵；文件头按Diamond协议解释。"
mapping:
  variables:
    tp:
      source: precipitation
      unit: mm
      temporal_kind: interval_accumulation
