name: cra_climatology
implementation: climatology_files
layout:
  filename: "ART_ATM_GLB_0P25_CLI_ANAL_{cycle_time:%m%d%H}.grib2"
cycle:
  period: year
example: "ART_ATM_GLB_0P25_CLI_ANAL_010100.grib2"
notes: "cycle_time保留为MMDDHH标签，不能伪造观测年份。其他文件后缀可通过显式描述调整路径模板，不另设格式预设。"
mapping:
  variables:
    z500: {unit: m}
    gh: {unit: m}
    t2m: {unit: K}
    msl: {unit: Pa}
    u10: {unit: m/s}
    v10: {unit: m/s}
