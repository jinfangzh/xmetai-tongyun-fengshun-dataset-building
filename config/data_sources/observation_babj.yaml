name: babj
format:
  name: babj
  encoding: gbk
  header_lines: 3
  columns:
  - year
  - month
  - day
  - hour
  - lead_time
  - lon
  - lat
  - pmin
  - vmax
layout:
  pattern: babj*.dat
time_zone: Asia/Shanghai
example: babj2501.dat
notes: "BABJ 台风报文：一个 GBK 文本文件保存一条台风的多个时次和时效。\n\n    root/\n      babj2501.dat\n  \
  \    babj2502.dat\n\n每个文件前三行为报文头；第二行提供台风名和编号。\n数值列依次为：年、月、日、时、预报时效、经度、纬度、最低气压、最大风速。\n\
  多余数值列原样保留，时间保持源数据的北京时间。\nread() 返回 record 维的原始记录，保留全部时效；是否只取 000 时效由调用方决定。\n写回需要读取时保留的表头、文件名和记录信息。不声明额外变量映射。"
