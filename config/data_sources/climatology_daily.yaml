name: daily_climatology
layout: {}
mapping:
  packed_variable: data
  packed_dimension: level
example: daily_climatology.nc
notes: "单文件日序气候态：一个 NetCDF 文件保存全年日序场。\n\n    daily_climatology.nc\n      data    \
  \                  打包的气象场\n      level                     打包变量标签（通道），不是气压层数值\n\
  \      time                      日序或带日期的时间坐标\n      其余空间坐标              保留文件原始名称和排列\n\
  \nread() 直接读取实际变量、维度及坐标；不预先列出气象变量。\nnormalize() 可按 level 标签拆分 data；365/366 天对齐、平滑和插值由评测层显式处理。"
format:
  name: netcdf
