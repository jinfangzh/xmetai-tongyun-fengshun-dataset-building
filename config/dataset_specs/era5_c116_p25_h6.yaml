# ERA5 c116 / 0.25° / 6小时 标准数据集定义。

# 第一部分：数据集标识、坐标、存储格式及校验要求。
meta_info:
  name: ERA5 c116 / 0.25° / 6小时
  dataset_id: era5.c116.p25.h6  # 产品与变体的配置标识。
  expected_root_dataset_id: era5.202501_202607.c116.p25.h6.v3
  product: {id: era5.c116, version: '1.0', variant: p25.h6}
  schema_version: '2.0'
  status: approved
  template_version: v1  # 本套模板规则的版本。
  dataset_path: /workspace/data/zarr_refresh_v3/era5.202501_202607.c116.p25.h6.v3
  auxiliary_directory: /workspace/data/zarr_refresh_v3/era5.202501_202607.c116.p25.h6.v3
  dataset_version: v3  # 数据内容版本标识。
  storage_format: {name: zarr, version: 3, allow_nested_groups: false}  # version表示Zarr存储格式版本。
  data_revision: '20260917'  # 数据修订标识。
  validation_scope: confirmed-format  # 校验范围标识。

  time_coverage:
    first: '2025-01-01T00:00:00.000000000'
    last: '2026-07-31T18:00:00.000000000'
    time_count: 2308
    time_resolution: {value: 6, unit: hour}
    timezone: UTC

  grid:
    space_resolution: 0.25  # 水平网格间隔，单位见coordinate_units。
    coordinate_units: degree
    latitude: {first: 90.0, last: -90.0, count: 721, direction: north-to-south}
    longitude: {first: 0.0, last: 359.75, count: 1440, direction: west-to-east}

  pressure:
    variables: [z, t, u, v, q, w]
    units: hPa
    channel_name_template: '{variable}{level}'
    levels: [1000, 925, 850, 700, 600, 500, 400, 300, 250, 200, 150, 100, 50, 10]

  channels: [z1000, z925, z850, z700, z600, z500, z400, z300, z250, z200, z150, z100, z50, t1000, t925, t850,  # 完整116通道的唯一顺序。
    t700, t600, t500, t400, t300, t250, t200, t150, t100, t50, u1000, u925, u850, u700, u600, u500, u400,
    u300, u250, u200, u150, u100, u50, v1000, v925, v850, v700, v600, v500, v400, v300, v250, v200, v150,
    v100, v50, q1000, q925, q850, q700, q600, q500, q400, q300, q250, q200, q150, q100, q50, d2m, t2m, msl,
    sp, skt, u10m, v10m, u100m, v100m, sst, tcw, tp, sd, z10, t10, u10, v10, q10, w1000, w925, w850, w700,
    w600, w500, w400, w300, w250, w200, w150, w100, w50, w10, ws10m, ws100m, lcc, mcc, hcc, tcc, ssr, ssrd,
    fdir, ttr, swvl1, swvl2, stl1, stl2, wmb, mwd, cdww, mwp, swh]

  arrays:
    data: {dimensions: [time, channel, lat, lon], dtype: float16, chunks: {time: 1, channel: full, lat: full, lon: full}}  # full表示对应维度的完整长度。
    time: {dimensions: [time], dtype: 'datetime64[ns]'}  # 时间值精度为纳秒。
    channel: {dimensions: [channel], dtype: string}
    lat: {dimensions: [lat], dtype: float32}
    lon: {dimensions: [lon], dtype: float32}
    mean: {dimensions: [channel], dtype: float32}
    std: {dimensions: [channel], dtype: float32}
    mask: {dimensions: [mask_channel, lat, lon], dtype: uint8}
    mask_channel: {dimensions: [mask_channel], dtype: string}

  mask:
    channels: [land_mask, sea_mask]
    allowed_values: [0, 1]
    valid_value: 1  # 1表示属于该通道标识的区域。
    complement_sum: 1  # 逐网格点要求陆地掩膜与海洋掩膜之和为1。

  metadata:
    data_attributes:  # data数组的属性要求。
      data_representation: normalized  # 主数组的数值表示类型。
      normalization_method: channel_dependent  # 处理流程按通道定义，步骤见variable_metadata。
      mean_variable: mean  # 有效偏移参数数组，顺序与channels一致。
      std_variable: std  # 有效缩放参数数组，顺序与channels一致。
      scale_factor_location: channel.channel_info[*].scale_factor  # channel属性中各通道缩放参数的位置声明。
      add_offset_location: channel.channel_info[*].add_offset  # channel属性中各通道偏移参数的位置声明。
      inverse_transform: preprocessed_value = data * scale_factor + add_offset  # 存储值到预处理值的恢复公式声明。

    channel_metadata:  # channel数组的逐通道属性要求。
      attribute: channel_info  # 逐通道属性字典名称。
      version_attribute: channel_info_schema_version  # 逐通道属性字典的结构版本字段。
      version: '1.0'  # channel_info的结构版本。
      require_exact_channels: true  # 键集合必须与完整channels清单一致。
      long_name_required: true  # 逐通道说明不能为空。
      scale_factor_from: std  # 与std中对应通道的数值一致。
      add_offset_from: mean  # 与mean中对应通道的数值一致。
      scale_offset_formula: preprocessed_value = normalized_value * scale_factor + add_offset  # 逐通道参数的恢复公式声明。

  normalization:
    statistics: {mean_finite: true, std_finite: true, std_positive: true}  # mean和std均须为有限值，且std严格大于0。
    effective_statistics:
      tp: {mean: 0.0, std: 1.0}  # log1p降水使用有效偏移0、缩放1，不再执行z-score。

  auxiliaries:
    check_variable_names: false  # NetCDF内部数据变量名不纳入约束。
    unregistered_file_status: warning  # 未登记附件仅报告警告。
    files:  # 文件名相对于auxiliary_directory。
      const.nc:
        format: netcdf
        role: const
        required: true
        dimensions: [channel, lat, lon]
        dtype: float32
        grid: main_data  # 空间坐标的数值、长度及顺序须与主网格一致。
        finite: true  # 所有数值均须为有限值。
        channels: [orography, lsm, coslat, sinlat, coslon, sinlon]  # 附件自身的完整通道顺序。
      weight.npy:
        grid_provenance: >-
          Review 2026-10-13: complete float32 latitude weight vector has declared axis (1,lat,1) and agrees with mean-normalized cos(latitude) within 5e-7.
        format: npy
        role: weight
        required: true
        dimensions: [singleton, lat, singleton]  # singleton维度长度为1。
        dtype: float32
        grid: main_data  # 轴长度与主网格匹配；坐标归属须有独立依据。
        finite: true  # 所有数值均须为有限值。
        nonnegative_atol: 1.0e-07  # 容差内的微小负值仍记录警告。
        require_positive_value: true  # 至少存在一个正权重。

# 第二部分：变量语义、来源及预处理流程。
# units表示预处理结果单位；preprocessing按声明顺序执行。
variable_metadata:
  z: {units: "m2 s-2", long_name: "Geopotential", source_name: "z", source_units: "m2 s-2", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  t: {units: "K", long_name: "Temperature", source_name: "t", source_units: "K", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  u: {units: "m s-1", long_name: "Eastward wind", source_name: "u", source_units: "m s-1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  v: {units: "m s-1", long_name: "Northward wind", source_name: "v", source_units: "m s-1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  q: {units: "g kg-1", long_name: "Specific humidity", source_name: "q", source_units: "kg kg-1", variable_type: "instantaneous", preprocessing: [{"operation": "multiply", "factor": 1000.0, "input_units": "kg kg-1", "output_units": "g kg-1"}, {"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  d2m: {units: "K", long_name: "2 metre dewpoint temperature", level_type: "height_above_ground", level: 2, level_units: "m", source_name: "d2m", source_units: "K", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  t2m: {units: "K", long_name: "2 metre temperature", level_type: "height_above_ground", level: 2, level_units: "m", source_name: "t2m", source_units: "K", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  msl: {units: "Pa", long_name: "Mean sea level pressure", level_type: "surface", source_name: "msl", source_units: "Pa", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  sp: {units: "Pa", long_name: "Surface pressure", level_type: "surface", source_name: "sp", source_units: "Pa", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  skt: {units: "K", long_name: "Skin temperature", level_type: "surface", source_name: "skt", source_units: "K", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  u10m: {units: "m s-1", long_name: "10 metre eastward wind", level_type: "height_above_ground", level: 10, level_units: "m", source_name: "u10m", source_units: "m s-1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  v10m: {units: "m s-1", long_name: "10 metre northward wind", level_type: "height_above_ground", level: 10, level_units: "m", source_name: "v10m", source_units: "m s-1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  u100m: {units: "m s-1", long_name: "100 metre eastward wind", level_type: "height_above_ground", level: 100, level_units: "m", source_name: "u100m", source_units: "m s-1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  v100m: {units: "m s-1", long_name: "100 metre northward wind", level_type: "height_above_ground", level: 100, level_units: "m", source_name: "v100m", source_units: "m s-1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  sst: {units: "K", long_name: "Sea surface temperature", level_type: "surface", source_name: "sst", source_units: "K", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  tcw: {units: "kg m-2", long_name: "Total column water", level_type: "surface", source_name: "tcw", source_units: "kg m-2", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  tp: {units: "1", long_name: "Log-transformed total precipitation", level_type: "surface", source_name: "tp", source_units: "m", variable_type: "accumulated", preprocessing: [{"operation": "multiply", "factor": 1000.0, "input_units": "m", "output_units": "mm"}, {"operation": "clip_min", "minimum": 0.0}, {"operation": "log1p"}]}
  sd: {units: "m", long_name: "Snow depth water equivalent", level_type: "surface", source_name: "sd", source_units: "m", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  w: {units: "Pa s-1", long_name: "Vertical velocity", source_name: "w", source_units: "Pa s-1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  ws10m: {units: "m s-1", long_name: "10 metre wind speed", level_type: "height_above_ground", level: 10, level_units: "m", source_name: ["u10m", "v10m"], source_units: "m s-1", variable_type: "derived", preprocessing: [{"operation": "hypot", "inputs": ["u10m", "v10m"]}, {"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  ws100m: {units: "m s-1", long_name: "100 metre wind speed", level_type: "height_above_ground", level: 100, level_units: "m", source_name: ["u100m", "v100m"], source_units: "m s-1", variable_type: "derived", preprocessing: [{"operation": "hypot", "inputs": ["u100m", "v100m"]}, {"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  lcc: {units: "1", long_name: "Low cloud cover", level_type: "surface", source_name: "lcc", source_units: "1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  mcc: {units: "1", long_name: "Medium cloud cover", level_type: "surface", source_name: "mcc", source_units: "1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  hcc: {units: "1", long_name: "High cloud cover", level_type: "surface", source_name: "hcc", source_units: "1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  tcc: {units: "1", long_name: "Total cloud cover", level_type: "surface", source_name: "tcc", source_units: "1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  ssr: {units: "W m-2", long_name: "Surface net short-wave radiation", level_type: "surface", source_name: "ssr", source_units: "J m-2", variable_type: "accumulated", preprocessing: [{"operation": "divide", "divisor": 21600.0, "accumulation_window_seconds": 21600, "input_units": "J m-2", "output_units": "W m-2"}, {"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  ssrd: {units: "W m-2", long_name: "Surface short-wave radiation downwards", level_type: "surface", source_name: "ssrd", source_units: "J m-2", variable_type: "accumulated", preprocessing: [{"operation": "divide", "divisor": 21600.0, "accumulation_window_seconds": 21600, "input_units": "J m-2", "output_units": "W m-2"}, {"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  fdir: {units: "W m-2", long_name: "Surface direct short-wave radiation", level_type: "surface", source_name: "fdir", source_units: "J m-2", variable_type: "accumulated", preprocessing: [{"operation": "divide", "divisor": 21600.0, "accumulation_window_seconds": 21600, "input_units": "J m-2", "output_units": "W m-2"}, {"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  ttr: {units: "W m-2", long_name: "Top net long-wave radiation", level_type: "surface", source_name: "ttr", source_units: "J m-2", variable_type: "accumulated", preprocessing: [{"operation": "divide", "divisor": 21600.0, "accumulation_window_seconds": 21600, "input_units": "J m-2", "output_units": "W m-2"}, {"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  swvl1: {units: "m3 m-3", long_name: "Volumetric soil water layer 1", level_type: "soil_layer", level: 1, level_units: "layer_index", source_name: "vsw1", source_units: "m3 m-3", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  swvl2: {units: "m3 m-3", long_name: "Volumetric soil water layer 2", level_type: "soil_layer", level: 2, level_units: "layer_index", source_name: "vsw2", source_units: "m3 m-3", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  stl1: {units: "K", long_name: "Soil temperature level 1", level_type: "soil_layer", level: 1, level_units: "layer_index", source_name: "sot1", source_units: "K", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  stl2: {units: "K", long_name: "Soil temperature level 2", level_type: "soil_layer", level: 2, level_units: "layer_index", source_name: "sot2", source_units: "K", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  wmb: {units: "m", long_name: "Model bathymetry", level_type: "surface", source_name: "wmb", source_units: "m", variable_type: "static", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  mwd: {units: "degree", long_name: "Mean wave direction", level_type: "surface", source_name: "mwd", source_units: "degree", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  cdww: {units: "1", long_name: "Coefficient of drag with waves", level_type: "surface", source_name: "cdww", source_units: "1", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  mwp: {units: "s", long_name: "Mean wave period", level_type: "surface", source_name: "mwp", source_units: "s", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
  swh: {units: "m", long_name: "Significant height of combined wind waves and swell", level_type: "surface", source_name: "swh", source_units: "m", variable_type: "instantaneous", preprocessing: [{"operation": "zscore", "mean": "/mean", "std": "/std"}]}
