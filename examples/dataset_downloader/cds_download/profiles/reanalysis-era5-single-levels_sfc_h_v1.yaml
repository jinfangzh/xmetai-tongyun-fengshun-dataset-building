# 单层与近地面：按月下载；本文件供新的通用下载器读取。
# 相对输出路径约定以本 YAML 所在目录为基准。
# 每个请求 = 一个变量 × 一个月 × 全部指定时次/气压层。
dataset: "reanalysis-era5-single-levels"
product_type:
  - "reanalysis"
variable:
  - "10m_u_component_of_wind"  # u10m
  - "10m_v_component_of_wind"  # v10m
  - "2m_dewpoint_temperature"  # d2m
  - "2m_temperature"  # t2m
  - "mean_sea_level_pressure"  # msl
  - "skin_temperature"  # skt
  - "surface_pressure"  # sp
  - "total_column_water"  # tcw
  - "snow_depth"  # sd
  - "sea_surface_temperature"  # sst
  - "100m_u_component_of_wind"  # u100m
  - "100m_v_component_of_wind"  # v100m
  - "total_precipitation"  # tp
time:
  - "00:00"
  - "06:00"
  - "12:00"
  - "18:00"
# time 仅选择时次，不会把降水/辐射自动聚合成 6 小时累积量。
area: [10, -90, -10, 90]
data_format: "netcdf"
download_format: "zip"
